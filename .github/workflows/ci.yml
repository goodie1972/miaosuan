name: CI

# 妙算持续集成：静态检查 + 单元测试 + 差分对拍。
# 对应架构 §9.7「依赖方向 CI 强制」与 T01 验收第 1、3、4 条。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + test + parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 完整历史，供 provenance 取 git_sha

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install（core + dev）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff（lint）
        run: ruff check src tests

      - name: ruff（format 校验）
        run: ruff format --check src tests

      - name: mypy（类型检查）
        run: mypy

      - name: 依赖方向检查（core 不得 import torch / adapters / tune / cli；不得 IO/读环境变量）
        run: pytest -q tests/test_dependency_direction.py

      - name: 单元测试
        run: pytest -q tests --ignore=tests/parity

      - name: 差分对拍（vocab 版本恒等）
        # 说明：CI 默认不装 torch；Oracle 使用 fixtures 中冻结的 AM 词表快照。
        # 若需真·活体对拍，安装 oracle extra：pip install -e ".[oracle]"
        run: pytest -q tests/parity

  secret-scan:
    name: gitleaks 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
