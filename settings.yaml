webui:
  port: 8686
  host: 127.0.0.1
  reload: false
shenji:
  port: 1783
  host: 127.0.0.1
  timeout: 3
mt4:
  host: 127.0.0.1
  port: 23232
  time_base: utc
  timeout: 5
  poll_wait: 1000
  drain_wait: 100
paths:
  artifacts: artifacts
  strategies: strategies
  results: data/results
  tmp: tmp
  kline: data/cache
  shenji_db: ''
data:
  timeout: 30
  source: ''
  api_url: ''
  dukascopy_user: ''
  dukascopy_password: ''
  proxy: http://127.0.0.1:10808
logging:
  level: DEBUG
  json_lines: true
notifiers:
  feishu:
    webhook_url: ''    # 飞书群机器人 Webhook；留空 = 未启用（仅日志兜底）
features:
  enable_webui: true
  enable_mt4: true
  enable_shenji: true
  enable_spec_management: true
  enable_backtest: true
  enable_tune: true
