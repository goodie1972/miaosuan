# 妙算（MiaoSuan）依赖锁文件
# 生成方式：pip install -e ".[dev,web,datasource]" 后 pip freeze（精确到补丁号）。
# 生成环境：Windows / CPython 3.13.14（本机无 3.11，见 README「已知差异」）。
# 复现：python -m venv .venv && .venv/Scripts/pip install -r requirements.lock
#
# 说明：
#   * 本锁反映「3.13 上实际可安装」的版本，且已含 web / datasource 两组包。
#   * 架构 §8 目标为 Python 3.11 + numpy>=1.26,<2.1；因本机无 3.11，且 numpy<2.1
#     在 3.13 无 wheel，故此处锁 numpy 2.5.x（pyproject 上界放宽到 <3 以兼容）。
#     在 3.11 上可回退到 numpy<2.1。
#   * pandas 严格锁 2.x（规避 pandas 3.0 API 变更）。
#   * 不含 torch：妙算生产运行时去 torch；torch 仅作 tests/parity 的 Oracle 可选依赖
#     （extra: [oracle]）。
#   * ⚠ 两行**非跨机可复现**（pip freeze 如实反映了本机安装来源），换机安装前需手改：
#       - tvdatafeed：本机由本地 zip 安装，改为
#         tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git
#       - miaosuan：本机为 editable + git+ssh 安装，换机请改为
#         pip install -e ".[dev,web,datasource]"（即删掉本行 -e ... 那条）

